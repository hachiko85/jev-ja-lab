[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jev-ja-lab"
version = "0.2.0"
description = "Reproducible Japanese decision-model evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
eval = [
  "accelerate>=1.10",
  "datasets>=4.0",
  "httpx>=0.27",
  "protobuf>=6.32",
  "sentencepiece>=0.2.2",
  "torch>=2.6",
  "transformers>=5.17",
]
viz = [
  "matplotlib>=3.10",
  "pandas>=2.2",
  "pyarrow>=18",
  "PyYAML>=6.0",
  "qrcode[pil]>=8.0",
]
orchestrate = [
  "matplotlib>=3.10",
  "pyarrow>=18",
  "PyYAML>=6.0",
]
laya = [
  "laya>=0.3.5",
]
jevlike = [
  "jevlike[transformers] @ git+https://github.com/vinnylarouge/jevlike.git",
]
# HopitAI/hopper LoRA. Adapter weights are research/demo use only.
hopper = [
  "peft>=0.21",
]
# Mapika/decider-4b. decider-ai's metadata pins numpy==1.26.4, which would downgrade
# numpy for the whole environment, so it is NOT listed here: install it without deps
#   uv pip install --no-deps decider-ai
# (the inference modules used by methods.decider do not import numpy).
decider = []
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
jev-ja-lab-eval = "openjev_ja.eval.cli:main"
jev-ja-lab-datasets = "openjev_ja.datasets_router:main"
jev-ja-lab-radar = "openjev_ja.visualize.cli:main"
jev-ja-lab-orchestrate = "openjev_ja.eval.orchestrate_cli:main"
jev-ja-lab-eval-noul = "openjev_ja.eval.eval_noul:main"
jev-ja-lab-eval-choice = "openjev_ja.eval.eval_choice:main"
jev-ja-lab-eval-score = "openjev_ja.eval.eval_score:main"
jev-ja-lab-eval-summary = "openjev_ja.eval.eval_summary:main"
jev-ja-lab-eval-workflow = "openjev_ja.eval.workflow:main"
jev-ja-lab-embedding-train = "openjev_ja.methods.embedding.train:main"
jev-ja-lab-jevlike-train = "openjev_ja.methods.jevlike.train:main"
jev-ja-lab-laya-bert-train = "openjev_ja.methods.laya_bert.train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openjev_ja"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not integration and not gpu\""
markers = [
  "integration: requires network access or external credentials",
  "gpu: requires a local model and accelerator",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
