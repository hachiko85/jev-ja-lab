[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jev-ja-lab"
version = "0.2.0"
description = "Reproducible Japanese decision-model evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# --- building blocks ---------------------------------------------------------------------
# eval: local model inference. orchestrate: YAML runner (+ result charts). viz: plotting.
eval = [
  "accelerate>=1.10",
  "datasets>=4.0",
  "httpx>=0.27",
  "protobuf>=6.32",
  "sentencepiece>=0.2.2",
  "torch>=2.6",
  "transformers>=5.17",
]
viz = [
  "matplotlib>=3.10",
  "pandas>=2.2",
  "pyarrow>=18",
  "PyYAML>=6.0",
  "qrcode[pil]>=8.0",
]
orchestrate = [
  "matplotlib>=3.10",
  "pyarrow>=18",
  "PyYAML>=6.0",
]

# --- one extra per library / scorer ---------------------------------------------------------
# `pip install "jev-ja-lab[semif]"` (or `uv sync --extra semif`) installs only what that
# library needs to be evaluated. When a new library (scorer) is added, add an extra with the
# same name here, mapped in tests/unit/test_extras.py, and list it in the README.
jev = [                       # TypeSafe Jev API (no local model)
  "httpx>=0.27",
  "jev-ja-lab[orchestrate]",
]
semif = ["jev-ja-lab[eval,orchestrate]"]        # semif (chat template + JSON, next-token logit)
semif-ja = ["jev-ja-lab[eval,orchestrate]"]     # semif-ja (Japanese prompt, next-token logit)
bert = ["jev-ja-lab[eval,orchestrate]"]         # BERT-family masked-LM scoring
embedding = ["jev-ja-lab[eval,orchestrate]"]    # frozen sentence encoder + trained head
openjev = ["jev-ja-lab[eval,orchestrate]"]      # AlexWortega/openjev (NLI cross-encoder)
clm = ["jev-ja-lab[eval,orchestrate]"]          # Contrastive-LM/CLM (Qwen3-8B + heads)
# interfaze-ai/lev (LoRA on Qwen3.5-4B), through the official `lev` package (Python >= 3.12).
lev = [
  "jev-ja-lab[eval,orchestrate]",
  "peft>=0.21",
  "pydantic>=2.12",
  "lev @ git+https://github.com/Abhinavexists/lev.git@cf104b69329302e4eac674a730c71f3511047db8#subdirectory=packages/lev ; python_version >= '3.12'",
]
# HopitAI/hopper LoRA. Adapter weights are research/demo use only.
hopper = [
  "jev-ja-lab[eval,orchestrate]",
  "peft>=0.21",
]
# Mapika/decider-4b. decider-ai's metadata pins numpy==1.26.4, which would downgrade numpy for
# the whole environment, so it is NOT listed here: after installing this extra run
#   pip install --no-deps decider-ai      (uv: uv pip install --no-deps decider-ai)
# (the inference modules used by methods.decider do not import numpy).
decider = ["jev-ja-lab[eval,orchestrate]"]
# firelex/jeff. Its pyproject pins torch==2.14.0/transformers==5.17.0/numpy==2.5.3/pillow==12.3.0
# exactly, which would fight this project's own pins (in particular swapping out the
# CUDA-enabled torch build), so it is NOT listed here: after installing this extra run
#   uv pip install --no-deps "jeff @ git+https://github.com/firelex/jeff.git@da8a9c0c067412c571fa25ec402dba4992767b7e"
# It also needs torchvision (for the Qwen3.5/Qwen3-VL processor, used even for text-only Gemma):
#   uv pip install --index-url https://download.pytorch.org/whl/cu128 "torchvision==0.26.0"
jeff = ["jev-ja-lab[eval,orchestrate]"]
# Cloudflare/clef-flash (Qwen3.5-9B + joint schema head): loaded through the release's own
# joint_schema_model.py. Needs bitsandbytes (the bf16 backbone is ~19GB, so 8bit/4bit is the
# way to fit a 16GB GPU) and, like jeff, torchvision for the Qwen3.5 image/video processor,
# installed from the CUDA index matching this project's torch:
#   uv pip install --index-url https://download.pytorch.org/whl/cu128 "torchvision==0.26.0"
clef = [
  "jev-ja-lab[eval,orchestrate]",
  "bitsandbytes>=0.45",
  "pillow",
]
# hotchpotch/bekko-system-one-v0: custom trust_remote_code inference class, loaded via
# transformers.dynamic_module_utils (the model's own recommended path). Needs
# sentence-transformers + scikit-learn, installed --no-deps (sentence-transformers would
# otherwise pull a newer torch and fight this project's CUDA build; scikit-learn is only
# needed for sentence-transformers' own top-level import chain, not the decision logic):
#   uv pip install --no-deps sentence-transformers==6.1.0
#   uv pip install scikit-learn
bekko-system-one = ["jev-ja-lab[eval,orchestrate]"]
laya = [
  "jev-ja-lab[eval,orchestrate]",
  "laya>=0.3.5",
]
laya-bert = [                 # laya's DecisionModel trained on a BERT-family encoder
  "jev-ja-lab[eval,orchestrate]",
  "laya>=0.3.5",
]
jevlike = [
  "jev-ja-lab[eval,orchestrate]",
  "jevlike[transformers] @ git+https://github.com/vinnylarouge/jevlike.git",
]
all = [                       # every library above except the decider-ai step
  "jev-ja-lab[jev,semif,semif-ja,bert,embedding,openjev,clm,clef,lev,jeff,bekko-system-one,hopper,decider,laya,laya-bert,jevlike]",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
jev-ja-lab-eval = "openjev_ja.eval.cli:main"
jev-ja-lab-datasets = "openjev_ja.datasets_router:main"
jev-ja-lab-radar = "openjev_ja.visualize.cli:main"
jev-ja-lab-orchestrate = "openjev_ja.eval.orchestrate_cli:main"
jev-ja-lab-eval-noul = "openjev_ja.eval.eval_noul:main"
jev-ja-lab-eval-choice = "openjev_ja.eval.eval_choice:main"
jev-ja-lab-eval-score = "openjev_ja.eval.eval_score:main"
jev-ja-lab-eval-summary = "openjev_ja.eval.eval_summary:main"
jev-ja-lab-eval-workflow = "openjev_ja.eval.workflow:main"
jev-ja-lab-embedding-train = "openjev_ja.methods.embedding.train:main"
jev-ja-lab-jevlike-train = "openjev_ja.methods.jevlike.train:main"
jev-ja-lab-laya-bert-train = "openjev_ja.methods.laya_bert.train:main"
jev-ja-lab-train-workflow = "openjev_ja.train.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openjev_ja"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not integration and not gpu\""
markers = [
  "integration: requires network access or external credentials",
  "gpu: requires a local model and accelerator",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
