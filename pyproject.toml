[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jev-ja-lab"
version = "0.2.0"
description = "Reproducible Japanese decision-model evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# --- building blocks ---------------------------------------------------------------------
# eval: local model inference. orchestrate: YAML runner (+ result charts). viz: plotting.
eval = [
  "accelerate>=1.10",
  "datasets>=4.0",
  "httpx>=0.27",
  "protobuf>=6.32",
  "sentencepiece>=0.2.2",
  "torch>=2.6",
  "transformers>=5.17",
]
viz = [
  "matplotlib>=3.10",
  "pandas>=2.2",
  "pyarrow>=18",
  "PyYAML>=6.0",
  "qrcode[pil]>=8.0",
]
orchestrate = [
  "matplotlib>=3.10",
  "pyarrow>=18",
  "PyYAML>=6.0",
]

# --- one extra per library / scorer ---------------------------------------------------------
# `pip install "jev-ja-lab[semif]"` (or `uv sync --extra semif`) installs only what that
# library needs to be evaluated. When a new library (scorer) is added, add an extra with the
# same name here, mapped in tests/unit/test_extras.py, and list it in the README.
jev = [                       # TypeSafe Jev API (no local model)
  "httpx>=0.27",
  "jev-ja-lab[orchestrate]",
]
semif = ["jev-ja-lab[eval,orchestrate]"]        # semif (chat template + JSON, next-token logit)
semif-ja = ["jev-ja-lab[eval,orchestrate]"]     # semif-ja (Japanese prompt, next-token logit)
bert = ["jev-ja-lab[eval,orchestrate]"]         # BERT-family masked-LM scoring
embedding = ["jev-ja-lab[eval,orchestrate]"]    # frozen sentence encoder + trained head
openjev = ["jev-ja-lab[eval,orchestrate]"]      # AlexWortega/openjev (NLI cross-encoder)
clm = ["jev-ja-lab[eval,orchestrate]"]          # Contrastive-LM/CLM (Qwen3-8B + heads)
# HopitAI/hopper LoRA. Adapter weights are research/demo use only.
hopper = [
  "jev-ja-lab[eval,orchestrate]",
  "peft>=0.21",
]
# Mapika/decider-4b. decider-ai's metadata pins numpy==1.26.4, which would downgrade numpy for
# the whole environment, so it is NOT listed here: after installing this extra run
#   pip install --no-deps decider-ai      (uv: uv pip install --no-deps decider-ai)
# (the inference modules used by methods.decider do not import numpy).
decider = ["jev-ja-lab[eval,orchestrate]"]
laya = [
  "jev-ja-lab[eval,orchestrate]",
  "laya>=0.3.5",
]
laya-bert = [                 # laya's DecisionModel trained on a BERT-family encoder
  "jev-ja-lab[eval,orchestrate]",
  "laya>=0.3.5",
]
jevlike = [
  "jev-ja-lab[eval,orchestrate]",
  "jevlike[transformers] @ git+https://github.com/vinnylarouge/jevlike.git",
]
all = [                       # every library above except the decider-ai step
  "jev-ja-lab[jev,semif,semif-ja,bert,embedding,openjev,clm,hopper,decider,laya,laya-bert,jevlike]",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
jev-ja-lab-eval = "openjev_ja.eval.cli:main"
jev-ja-lab-datasets = "openjev_ja.datasets_router:main"
jev-ja-lab-radar = "openjev_ja.visualize.cli:main"
jev-ja-lab-orchestrate = "openjev_ja.eval.orchestrate_cli:main"
jev-ja-lab-eval-noul = "openjev_ja.eval.eval_noul:main"
jev-ja-lab-eval-choice = "openjev_ja.eval.eval_choice:main"
jev-ja-lab-eval-score = "openjev_ja.eval.eval_score:main"
jev-ja-lab-eval-summary = "openjev_ja.eval.eval_summary:main"
jev-ja-lab-eval-workflow = "openjev_ja.eval.workflow:main"
jev-ja-lab-embedding-train = "openjev_ja.methods.embedding.train:main"
jev-ja-lab-jevlike-train = "openjev_ja.methods.jevlike.train:main"
jev-ja-lab-laya-bert-train = "openjev_ja.methods.laya_bert.train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openjev_ja"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not integration and not gpu\""
markers = [
  "integration: requires network access or external credentials",
  "gpu: requires a local model and accelerator",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
