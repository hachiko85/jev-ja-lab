version: 1
runtime:
  run_name: eval-semif-logit-fewshot-series
  smoke_run_name: eval-semif-logit-fewshot-series-smoke
  resume: true
  seed: 42
  models_root: models
  datasets_root: datasets
  output_root: results
  devices:
  - cuda:0
  parallelism: 1
  batch_size: 1
  worker_timeout_seconds: 86400
workflow:
  order:
  - noul
  - choice
  - score
  - summary
tasks:
  noul:
    enabled: true
    datasets:
    - jnli_entailment
    - jnli_contradiction
    - jnli_missing_evidence
    - janli_entailment
    - jcola_in_domain
    - jcola_out_of_domain
    - paws_x_ja
    - textdetox_ja
    - jad_afc_true
    - jad_afc_false
    - jad_afc_nei
    - wrime_joy_binary
    - wrime_anger_binary
    - wrime_positive_binary
    aggregate_metric: f1
    smoke_limit: 5
    chart:
      enabled: true
      name: radar-semif-logit-fewshot-noul
      title: Noul evaluation
      subtitle: Binary decision F1
      metric: f1
      theme: dark
      language: ja
    model_ids:
    - semif-logit-fewshot-qwen3.5-4b-2shot-noul
  choice:
    enabled: true
    datasets:
    - mmmlu_ja
    - jmmlu
    - jgpqa_diamond
    - jcommonsenseqa
    - xwinograd_ja
    - mgsm_ja
    - gsm8k_ja_mc4
    - gsm8k_ja_mc10
    - jnli
    aggregate_metric: accuracy
    smoke_limit: 5
    chart:
      enabled: true
      name: radar-semif-logit-fewshot-choice
      title: Choice evaluation
      subtitle: Top-1 accuracy
      metric: accuracy
      theme: dark
      language: ja
    model_ids:
    - semif-logit-fewshot-qwen3.5-4b-2shot-choice
  score:
    enabled: true
    datasets:
    - wrime_joy
    - wrime_anger
    - wrime_sentiment
    - synthetic_urgency
    - synthetic_dissatisfaction
    - synthetic_risk
    - synthetic_relevance
    aggregate_metric: normalized_quadratic_weighted_kappa
    smoke_limit: 5
    chart:
      enabled: true
      name: radar-semif-logit-fewshot-score
      title: Score evaluation
      subtitle: Normalized quadratic weighted kappa
      metric: normalized_quadratic_weighted_kappa
      theme: dark
      language: ja
    model_ids:
    - semif-logit-fewshot-qwen3.5-4b-2shot-score
  summary:
    enabled: true
    weights:
      noul: 1.0
      choice: 1.0
      score: 1.0
    chart:
      enabled: true
      name: radar-semif-logit-fewshot-summary
      title: Overall Primitive evaluation
      subtitle: Noul, Choice, Score and equal-weight overall score
      theme: dark
      language: ja
